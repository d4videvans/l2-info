---
name: Apply final RC3 identity feedback once

on:
  push:
    branches:
      - fix/rc3-release-identity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc3-release-identity
          fetch-depth: 0

      - name: Apply feedback
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {n}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'luci-app-l2-info/htdocs/luci-static/resources/l2-info/release.js',
              "/* Public pre-upstream test identity. Keep packageVersion in sync with the\n * LuCI Makefile; tests/run.sh enforces that relationship and the public docs. */",
              "/* Public pre-upstream test identity. This identifies the tagged source tree;\n * installed package versions remain the package manager's responsibility. */",
          )
          replace_once(
              'luci-app-l2-info/htdocs/luci-static/resources/l2-info/release.js',
              "\ttag: 'v0.1.0-rc3',\n\tpackageVersion: '0.1.0-r3'",
              "\ttag: 'v0.1.0-rc3'",
          )

          replace_once(
              'luci-app-l2-info/htdocs/luci-static/resources/view/l2-info/main.js',
              "\t\t[ _('Test release'), release.tag + ' · luci-app-l2-info ' + release.packageVersion ],",
              "\t\t[ _('Test release'), release.tag ],",
          )
          replace_once(
              'luci-app-l2-info/htdocs/luci-static/resources/view/l2-info/main.js',
              "function fmtDiffVlan(vlans) {\n\tvar none = el('em', {}, _('none')), out = [];\n\t(vlans || []).forEach(function(v, i) { if (i) out.push(', '); out.push(v == null ? el('em', {}, _('none')) : String(v)); });\n\treturn out.length ? out : none;\n}",
              "function fmtDiffVlan(vlans) {\n\tvar out = [];\n\t(vlans || []).forEach(function(v, i) { if (i) out.push(', '); out.push(v == null ? el('em', {}, _('none')) : String(v)); });\n\treturn out.length ? out : el('em', {}, _('none'));\n}",
          )

          replace_once(
              'README.md',
              "For an ordinary bug or confusing result, include the OpenWrt version, device\nmodel/target, and what the **Device and data-source details** panel says. On\nRC3 and later that panel includes the public test-release identity and LuCI\npackage version; for a headless/backend-only test, include the exact revision or\ntag copied instead.\n",
              "For an ordinary bug or confusing result, include the OpenWrt version, device\nmodel/target, the exact revision or tag copied, and what the **Device and\ndata-source details** panel says. On RC3 and later the **Test release** line\ncorroborates the intended public candidate; it does not replace the exact\nrevision/tag because an edited or untagged checkout can still carry that\nbuild-time label.\n",
          )

          replace_once(
              'docs/getting-started.md',
              "Under **Device and data-source details**, the page also shows the public test\nrelease and LuCI package version (for RC3: `v0.1.0-rc3 · luci-app-l2-info\n0.1.0-r3`). That identity is shipped as a LuCI resource, so it remains visible\neven when `tools/install-test.sh` copied the checkout directly and no package\nmanager record exists.\n",
              "Under **Device and data-source details**, the page also shows the intended\npublic test release (for RC3: `v0.1.0-rc3`). That label is shipped as a LuCI\nresource, so it remains visible when `tools/install-test.sh` copies a checkout\ndirectly. It is a corroborating build-time label, not proof that the checkout\nwas unmodified or that a package with that version is installed.\n",
          )
          replace_once(
              'docs/getting-started.md',
              "- the **Test release** line shown under **Device and data-source details**, or\n  the exact revision/tag copied for a headless/backend-only test;\n",
              "- the exact revision/tag copied;\n- the **Test release** line shown under **Device and data-source details** when\n  LuCI is installed, as a corroborating label rather than a substitute for the\n  revision/tag;\n",
          )

          replace_once(
              'docs/release-notes-v0.1.0-rc3.md',
              "The LuCI app also ships a small release-identity resource. **Device and data-source details** shows:\n\n`v0.1.0-rc3 · luci-app-l2-info 0.1.0-r3`\n\nThat remains visible for the documented copied-checkout test install, where `apk`/`opkg` has no application-package record to report.\n\nA mechanical test keeps the public tag, LuCI package version, installed release resource, installer/uninstaller manifests, README and current release notes in sync.",
              "The LuCI app also ships a small release-identity resource. **Device and data-source details** shows the intended public source-tree identity:\n\n`v0.1.0-rc3`\n\nThat remains visible for the documented copied-checkout test install without pretending that an application package is installed. For a real package installation, `apk`/`opkg` remains authoritative for installed package versions.\n\nA mechanical test keeps the public tag, LuCI package metadata, installed release resource, installer/uninstaller manifests and current release documentation in sync.",
          )
          replace_once(
              'docs/release-notes-v0.1.0-rc3.md',
              "Please report new testing against `v0.1.0-rc3`. Include the OpenWrt version, device model/target, snapshot duration, relevant **Device and data-source details**, and what looked wrong or confusing. The **Test release** row should make the exact LuCI candidate visible without relying on memory of which archive was copied.",
              "Please report new testing against `v0.1.0-rc3`. Include the OpenWrt version, device model/target, exact revision/tag copied, snapshot duration, relevant **Device and data-source details**, and what looked wrong or confusing. The **Test release** row corroborates the intended public candidate but does not replace the revision/tag, because local edits or an untagged checkout can retain the build-time label.",
          )

          replace_once(
              'CONVENTIONS.md',
              "- public test-release identity, LuCI package metadata and installer/docs references stay in sync;",
              "- public test-release identity, LuCI package metadata and installer/docs\n  references stay in sync;",
          )

          p = Path('tests/run.sh')
          text = p.read_text()
          start = text.index("\t# Public test-release identity: copied-checkout installs bypass the package\n")
          end = text.index("\n\t# Demo rewrites share one authoritative precondition checker with install.\n", start)
          block = r'''\t# Public test-release identity: copied-checkout installs bypass the package
\t# manager, so the LuCI page carries the intended public tag. Keep that tag,
\t# package metadata, installer manifests and current docs in sync. The label is
\t# corroborating evidence only: reports still include the exact revision/tag copied.
\tRELEASE_JS="$VIEW/htdocs/luci-static/resources/l2-info/release.js"
\trelease_tag=$(sed -n "s/^[[:space:]]*tag: '\\([^']*\\)'.*/\\1/p" "$RELEASE_JS")
\tpkg_version=$(sed -n 's/^PKG_VERSION:=//p' "$VIEW/Makefile")
\tpkg_release=$(sed -n 's/^PKG_RELEASE:=//p' "$VIEW/Makefile")
\trelease_status=0
\trelease_problem() {
\t\techo "    release identity: $1"
\t\trelease_status=1
\t}
\t[ -n "$release_tag" ] || release_problem "release.js has no tag"
\t[ -n "$pkg_version" ] || release_problem "LuCI Makefile has no PKG_VERSION"
\t[ -n "$pkg_release" ] || release_problem "LuCI Makefile has no PKG_RELEASE"
\tcase "$release_tag" in
\t\t"v${pkg_version}"-rc*) : ;;
\t\t*) release_problem "tag '$release_tag' does not match PKG_VERSION '$pkg_version'" ;;
\tesac
\tgrep -Fq "'require l2-info.release as release';" "$VIEW/htdocs/luci-static/resources/view/l2-info/main.js" || \\
\t\trelease_problem "main.js does not import release.js"
\tgrep -Fq "_('Test release')" "$VIEW/htdocs/luci-static/resources/view/l2-info/main.js" || \\
\t\trelease_problem "main.js does not render Test release"
\tfor doc in "$ROOT/README.md" "$ROOT/docs/getting-started.md" "$ROOT/docs/release-checklist.md"; do
\t\tgrep -Fq "$release_tag" "$doc" || release_problem "${doc#$ROOT/} does not name $release_tag"
\tdone
\t[ -f "$ROOT/docs/release-notes-${release_tag}.md" ] || \\
\t\trelease_problem "docs/release-notes-${release_tag}.md is missing"
\tgrep -Fq "release.js:/www/luci-static/resources/l2-info/release.js" "$ROOT/tools/install-dev-luci.sh" || \\
\t\trelease_problem "install-dev-luci.sh does not install release.js"
\tgrep -Fq "/www/luci-static/resources/l2-info/release.js" "$ROOT/tools/uninstall-test.sh" || \\
\t\trelease_problem "uninstall-test.sh does not remove release.js"
\tcheck "release: public test identity is internally consistent" "$release_status"
'''
          text = text[:start] + block + text[end:]
          p.write_text(text)
          PY

      - name: Regenerate LuCI translation template
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          git clone --depth=1 https://github.com/openwrt/luci.git luci-scan
          rm -rf luci-scan/applications/luci-app-l2-info
          cp -a luci-app-l2-info luci-scan/applications/luci-app-l2-info
          (cd luci-scan && build/i18n-scan.pl applications/luci-app-l2-info) > luci-app-l2-info/po/templates/l2-info.pot
          rm -rf luci-scan

      - name: Commit and self-remove
        run: |
          rm .github/workflows/rc3-feedback-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine RC3 release identity semantics'
          git push origin HEAD:fix/rc3-release-identity
