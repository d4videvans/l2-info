---
name: Apply final RC3 identity feedback once

on:
  push:
    branches:
      - fix/rc3-release-identity

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc3-release-identity
          fetch-depth: 0
      - name: Apply feedback
        run: python3 .github/rc3-feedback-wrapper.py
      - name: Regenerate LuCI translation template
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext
          git clone --depth=1 https://github.com/openwrt/luci.git luci-scan
          rm -rf luci-scan/applications/luci-app-l2-info
          cp -a luci-app-l2-info luci-scan/applications/luci-app-l2-info
          (cd luci-scan && build/i18n-scan.pl applications/luci-app-l2-info) > luci-app-l2-info/po/templates/l2-info.pot
          rm -rf luci-scan
      - name: Commit and self-remove
        run: |
          rm .github/rc3-feedback.py .github/rc3-feedback-wrapper.py .github/workflows/rc3-feedback-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine RC3 release identity semantics'
          git push origin HEAD:fix/rc3-release-identity
