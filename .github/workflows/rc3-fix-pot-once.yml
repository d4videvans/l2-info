---
name: Regenerate RC3 POT once

on:
  push:
    branches:
      - fix/rc3-release-identity

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/rc3-release-identity
      - name: Install gettext and regenerate POT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          git clone --depth=1 https://github.com/openwrt/luci.git /tmp/luci
          rm -rf /tmp/luci/applications/luci-app-l2-info
          cp -a luci-app-l2-info /tmp/luci/applications/luci-app-l2-info
          (cd /tmp/luci && ./build/i18n-scan.pl applications/luci-app-l2-info) \
            > luci-app-l2-info/po/templates/l2-info.pot
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/rc3-fix-pot-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Regenerate RC3 LuCI translation template"
          git push origin HEAD:fix/rc3-release-identity
