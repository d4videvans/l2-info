---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  UCODE_COMMIT: b885dd0fe1e974551fb1233ca5f3aa74d80b74d9

jobs:
  unit:
    name: Unit and fixture tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install ucode build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libjson-c-dev pkg-config

      - name: Build OpenWrt-pinned host ucode
        run: |
          git init /tmp/ucode
          git -C /tmp/ucode remote add origin https://github.com/jow-/ucode.git
          git -C /tmp/ucode fetch --depth=1 origin "$UCODE_COMMIT"
          git -C /tmp/ucode checkout FETCH_HEAD
          cmake -S /tmp/ucode -B /tmp/ucode-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DFS_SUPPORT=ON \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF \
            -DRESOLV_SUPPORT=OFF
          cmake --build /tmp/ucode-build --parallel
          sudo cmake --install /tmp/ucode-build
          sudo ldconfig
          test "$(ucode -e 'print("ok")')" = ok

      - name: Validate fixture JSON
        run: |
          find fixtures -type f -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Run complete test suite
        run: sh tests/run.sh

  luci-eslint:
    name: Current LuCI lint and i18n
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Stage app in current LuCI tree
        run: |
          git clone --depth=1 https://github.com/openwrt/luci.git /tmp/luci
          rm -rf /tmp/luci/applications/luci-app-l2-info
          cp -a luci-app-l2-info /tmp/luci/applications/luci-app-l2-info

      - name: Install LuCI's declared lint dependencies
        working-directory: /tmp/luci
        run: npm install --no-audit --no-fund

      - name: Run LuCI's ESLint configuration
        working-directory: /tmp/luci
        run: |
          npx eslint \
            applications/luci-app-l2-info/htdocs/luci-static/resources/**/*.js \
            applications/luci-app-l2-info/root/usr/share/**/*.json

      - name: Generate LuCI translation template
        working-directory: /tmp/luci
        run: |
          ./build/i18n-scan.pl applications/luci-app-l2-info \
            > /tmp/l2-info.pot
          test -s /tmp/l2-info.pot

      - name: Upload generated translation template
        uses: actions/upload-artifact@v6
        with:
          name: l2-info-pot
          path: /tmp/l2-info.pot

  upstream-build:
    name: OpenWrt/LuCI package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build both intended upstream packages in official SDK
        run: |
          docker run --rm \
            -v "$PWD:/workspace:ro" \
            openwrt/sdk:x86_64-master \
            bash -lc '
              set -eux
              [ -d scripts ] || ./setup.sh
              ./scripts/feeds update packages luci

              rm -rf package/l2-info
              cp -a /workspace/l2-info package/l2-info

              rm -rf feeds/luci/applications/luci-app-l2-info
              cp -a /workspace/luci-app-l2-info feeds/luci/applications/luci-app-l2-info
              ./scripts/feeds update -i luci

              ./scripts/feeds install -f l2-info luci-app-l2-info
              make defconfig
              make package/l2-info/compile V=s -j"$(nproc)"
              make package/feeds/luci/luci-app-l2-info/compile V=s -j"$(nproc)"
            '
