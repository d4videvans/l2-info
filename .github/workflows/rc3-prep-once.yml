---
name: Prepare RC3 release identity once

on:
  push:
    branches:
      - fix/rc3-release-identity

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/rc3-release-identity
          fetch-depth: 0

      - name: Apply RC3 consistency changes
        run: python3 .github/rc3-prep.py

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext

      - name: Regenerate LuCI translation template
        run: |
          git clone --depth=1 https://github.com/openwrt/luci.git /tmp/luci
          rm -rf /tmp/luci/applications/luci-app-l2-info
          cp -a luci-app-l2-info /tmp/luci/applications/luci-app-l2-info
          /tmp/luci/build/i18n-scan.pl /tmp/luci/applications/luci-app-l2-info \
            > luci-app-l2-info/po/templates/l2-info.pot

      - name: Commit prepared candidate
        run: |
          rm -f .github/rc3-prep.py .github/workflows/rc3-prep-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Prepare v0.1.0-rc3 release identity"
          git push origin HEAD:fix/rc3-release-identity
